# Deployment untuk order-service
apiVersion: apps/v1
kind: Deployment                                              # define kubernetes objects deployment
metadata:
  name: order-service                                         # nama dari deployment
  namespace: e-commerce                                       # service ini akan berjalan di namespace e-commerce
spec:
  replicas: 1                                                 # pod yang akan dideploy hanya akan berjumlah 1
  selector:                                                   # selector untuk mencocokkan pod yang dikontrol deployment ini
    matchLabels:
      app: order-service                                      # pod yang memiliki label 'app: order-service' akan dipilih
  template:                                                   # template yang digunakan untuk membuat pod baru
    metadata:
      labels:
        app: order-service                                    # label yang diberikan ke Pod yang dibuat dari template ini
    spec:
      containers:                                             # daftar kontainer dalam Pod
        - name: order-service                                 # nama kontainer
          image: ghcr.io/tri-susilo/order-service:latest      # image container yang akan dijalankan
          ports:
            - containerPort: 3000                             # port dalam kontainer yang akan dibuka
          env:                                                # environment variables untuk kontainer
            - name: PORT
              value: "3000"                                   # menentukan port yang digunakan oleh aplikasi di dalam kontainer
            - name: AMQP_URL
              value: "amqp://guest:guest@rabbitmq:5672"       # URL koneksi ke RabbitMQ,
