apiVersion: v1
kind: ConfigMap                           # jenis kubernetes objects
metadata:
  name: rabbitmq-config                   # nama service
  namespace: e-commerce                   # namespace tempat service ini dijalankan
data:
  rabbitmq.conf: |
    loopback_users.guest = false          
    listeners.tcp.default = 5672
    management.listener.port = 15672
    management.listener.ip = 0.0.0.0

---
  # rabbitmq.conf: |                      # Kunci data bernama 'rabbitmq.conf' berisi konfigurasi file RabbitMQ
  #   loopback_users.guest = false        # Mengizinkan user 'guest' login dari luar localhost (default-nya hanya lokal)
  #   listeners.tcp.default = 5672        # Port default RabbitMQ untuk menerima koneksi AMQP
  #   management.listener.port = 15672    # Port untuk UI manajemen RabbitMQ
  #   management.listener.ip = 0.0.0.0    # Bind UI manajemen ke semua IP (akses dari luar diperbolehkan)